float:
  euclidean:
  - base_args: ['@metric']
    constructor: AnnMultiprobe
    docker_tag: ann-benchmarks-ann_multiprobe
    module: ann_benchmarks.algorithms.ann_multiprobe
    name: ann-multiprobe
    run_groups:
      # One representative operating point: a (grid_dims=6, grid_splits=5) index
      # swept over n_probe. On glove-200-angular this reaches recall@10 ~ 0.78 at
      # n_probe=16 (the paper's 0.80 reporting point); (6,2) with n_probe=4 reaches
      # ~0.90. This single point is a quickstart, NOT the full Pareto front -- the
      # per-dataset sweeps in the paper were derived via tuning/ (see
      # docs/REPRODUCTION.md), then dropped in here as additional run_groups.
      multiprobe-d6-g5:
        args: [[6], [5]]
        query_args: [[1, 2, 4, 8, 16]]
  angular:
  - base_args: ['@metric']
    constructor: AnnMultiprobe
    docker_tag: ann-benchmarks-ann_multiprobe
    module: ann_benchmarks.algorithms.ann_multiprobe
    name: ann-multiprobe
    run_groups:
      # See the euclidean block above. (6,5) is a glove-200-angular operating point.
      multiprobe-d6-g5:
        args: [[6], [5]]
        query_args: [[1, 2, 4, 8, 16]]
