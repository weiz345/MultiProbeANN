[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "multiprobe-ann"
version = "0.1.0"
description = "Multi-Probe Grid for approximate nearest neighbor search"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
# Tuning + figure reproduction (host-side; the Docker image installs core only).
repro = [
    "h5py>=3.0.0",
    "matplotlib>=3.4.0",
    "optuna>=3.0.0",
    "pyyaml>=5.4.0",
]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src/ for the `ann` package; repo root for `tuning` and `reproduce`.
pythonpath = ["src", "."]
testpaths = ["tests"]
